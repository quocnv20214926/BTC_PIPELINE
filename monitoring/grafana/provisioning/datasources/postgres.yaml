apiVersion: 1

datasources:
  - name: Market PostgreSQL
    uid: postgres-market
    type: postgres
    access: proxy
    url: postgres:5432
    user: pipeline
    database: market
    isDefault: true
    editable: false
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
