name: btc-market-pipeline
x-app: &app
  build: .
  image: btc-market-pipeline:local
  environment: &env
    DATABASE_URL: postgresql://pipeline:${POSTGRES_PASSWORD:?Create .env first}@postgres:5432/market
    KAFKA_BOOTSTRAP: kafka:9092
    BACKFILL_DAYS: ${BACKFILL_DAYS:-28}   # tối đa: Binance chỉ giữ ~30 ngày open interest / ratio
    LOOKBACK: ${LOOKBACK:-60}
    POLL_SECONDS: ${POLL_SECONDS:-60}
  volumes:
    - ./artifacts:/app/artifacts
  depends_on:
    init:
      condition: service_completed_successfully
  restart: unless-stopped
services:
  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1' ]
      interval: 10s
      timeout: 10s
      retries: 18
    restart: unless-stopped
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env first}
      POSTGRES_DB: market
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ CMD-SHELL, 'pg_isready -U pipeline -d market' ]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  init:
    build: .
    image: btc-market-pipeline:local
    environment: *env
    command: [ python, -m, pipeline, init ]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: 'no'
  collector:
    <<: *app
    command: [ python, -m, pipeline, collect ]
  writer:
    <<: *app
    command: [ python, -m, pipeline, write ]
  publisher:
    <<: *app
    command: [ python, -m, pipeline, publish ]
  model-signals-v3:
    <<: *app
    environment:
      <<: *env
      MODEL_V3_BUNDLE: ${MODEL_V3_BUNDLE:-artifacts/5m_event_v3/model_v3.joblib}
      MODEL_V3_HISTORY_DAYS: ${MODEL_V3_HISTORY_DAYS:-20}
      MODEL_V3_MIN_EV: ${MODEL_V3_MIN_EV:-}
    command: [ python, -m, pipeline, model-signals-v3 ]
  model-signals:
    <<: *app
    profiles: [ v2 ]   # model v2 cũ; bật bằng: docker compose --profile v2 up -d
    environment:
      <<: *env
      MODEL_BUNDLE: ${MODEL_BUNDLE:-artifacts/5m_xgboost_signal_v2/models_final.joblib}
      MODEL_HISTORY_DAYS: ${MODEL_HISTORY_DAYS:-30}
      EXEC_RR: ${EXEC_RR:-1}
      EXEC_MODE: ${EXEC_MODE:-abs}
      EXEC_MIN_SCORE: ${EXEC_MIN_SCORE:-0.05}
      EXEC_TOP_FRAC: ${EXEC_TOP_FRAC:-0.02}
      EXEC_FEE_ROUNDTRIP: ${EXEC_FEE_ROUNDTRIP:-0.001}
    command: [ python, -m, pipeline, model-signals ]
  telegram:
    <<: *app
    environment:
      <<: *env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_SOURCE: ${TELEGRAM_SOURCE:-modelv3_event}
      TELEGRAM_HEALTH_SERVICE: ${TELEGRAM_HEALTH_SERVICE:-model-signals-v3}
      TELEGRAM_TRACK_RR: ${TELEGRAM_TRACK_RR:-1}
      TELEGRAM_FEE_PCT: ${TELEGRAM_FEE_PCT:-0.001}
      TELEGRAM_ONE_AT_A_TIME: ${TELEGRAM_ONE_AT_A_TIME:-false}
      TELEGRAM_MAX_SIGNAL_AGE_MIN: ${TELEGRAM_MAX_SIGNAL_AGE_MIN:-15}
      TELEGRAM_UTC_OFFSET_HOURS: ${TELEGRAM_UTC_OFFSET_HOURS:-7}
      TELEGRAM_DAILY_HOUR: ${TELEGRAM_DAILY_HOUR:-8}
    command: [ python, -m, pipeline, telegram ]
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_USERS_DEFAULT_THEME: dark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env first}
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      KAFKA_CLUSTERS_0_NAME: btc-pipeline
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
  cli:
    <<: *app
    command: [ python, -m, pipeline, status ]
    profiles: [ tools ]
    restart: 'no'
volumes:
  kafka_data:
  postgres_data:
  grafana_data:
